name: Embasic E-Clock Public Android and Wear CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eclock-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-tests:
    name: Synthetic public audit contract tests
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public-only test source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run isolated synthetic-only security and history regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Audit every reachable Public Git revision (not Private history)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_public_git_history.py

  source-audit:
    name: Security and licensing gate (NO-GO until approved)
    needs: bootstrap-tests
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public sources with full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require protected Public main before considering source approval
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/check_branch_protection.py
      - name: Verify source, license and administrator-managed SHA-256 approval
        env:
          ECLOCK_APPROVED_PUBLIC_SHA256: ${{ vars.ECLOCK_APPROVED_PUBLIC_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          python3 tools/audit_public_git_history.py
          python3 tools/verify_snapshot.py

  build:
    name: ${{ matrix.target }} tests lint debug build
    needs: source-audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [core, phone, wear]
    steps:
      - name: Checkout reviewed public source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 9.6.0 with upstream SHA256 verification
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/gradle.sha256" https://services.gradle.org/distributions/gradle-9.6.0-bin.zip.sha256
          printf '%s  %s\n' "$(tr -d '\r\n ' < "$RUNNER_TEMP/gradle.sha256")" "$RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.6.0/bin" >> "$GITHUB_PATH"
      - name: Android SDK 37 and build tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
      - name: Core unit tests and lint
        if: matrix.target == 'core'
        run: |
          gradle --no-daemon --console=plain :core:model:testDebugUnitTest :core:alarm:testDebugUnitTest :core:sync:testDebugUnitTest :core:data:testDebugUnitTest :core:data:lintDebug
      - name: Phone unit tests lint and debug build
        if: matrix.target == 'phone'
        run: |
          gradle --no-daemon --console=plain :app-phone:testDebugUnitTest :app-phone:lintDebug :app-phone:assembleDebug
      - name: Wear unit tests lint and debug build
        if: matrix.target == 'wear'
        run: |
          gradle --no-daemon --console=plain :app-wear:testDebugUnitTest :app-wear:lintDebug :app-wear:assembleDebug
      - name: Record APK commit and SHA256
        if: success() && matrix.target != 'core'
        shell: bash
        run: |
          set -euo pipefail
          module=app-${{ matrix.target }}
          mkdir -p evidence
          test "$(find "$module/build/outputs/apk/debug" -name '*.apk' -type f | wc -l)" -eq 1
          sha256sum "$module"/build/outputs/apk/debug/*.apk > evidence/SHA256SUMS.txt
          printf 'sha=%s\nmodule=%s\n' "$GITHUB_SHA" "$module" > evidence/build-info.txt
      - name: Upload debug APK only after approved source and redistribution
        if: success() && matrix.target != 'core'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: eclock-${{ matrix.target }}-debug
          path: |
            app-${{ matrix.target }}/build/outputs/apk/debug/*.apk
            evidence/*
          if-no-files-found: error
          retention-days: 3
